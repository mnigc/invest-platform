name: Data Sync (Supabase)

on:
  # 每交易日 23:30（北京时间）→ GitHub Actions 用 UTC，即 15:30；周一至周五
  schedule:
    - cron: "30 15 * * 1-5"
  # 允许手动触发（补跑/调试）
  workflow_dispatch:

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - name: Install dependencies
        working-directory: sync
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Network diagnostics
        if: always()
        continue-on-error: true
        run: |
          echo "== FRED 直连测试 =="
          curl -sS -m 15 -o /dev/null -w "fred http_code=%{http_code}\n" https://api.stlouisfed.org || echo "FRED 直连失败"

      - name: "Run gold_decision sync (国际源: gold-api + Yahoo + FRED)"
        working-directory: sync
        run: python run_sync.py gold_decision
        # 说明：金价历史 + DXY 走 Yahoo，需境外网络，故在 GitHub Actions(海外) 跑。

      - name: "Run indices sync (美股四大指数: stooq/Yahoo)"
        working-directory: sync
        run: python run_sync.py indices

      - name: "Run regime_backtest sync (预计算回测)"
        working-directory: sync
        run: python run_sync.py regime_backtest
        # 说明：基于指标数据预计算宏观体制回测（含多指数×体制回测矩阵）

      - name: "Run macro_analysis sync (宏观分析交叉数据)"
        working-directory: sync
        run: python run_sync.py macro_analysis
        # 说明：收益率曲线/通胀预期/信用利差等FRED指标同步

      - name: "Run global_liquidity sync (全球流动性: 美联储资产负债表/SOFR/IORB/准备金/M1M2)"
        working-directory: sync
        run: python run_sync.py global_liquidity
        # 说明：本轮扩充 IORB/WRESBAL/M1/M2，补齐「准备金→SOFR」传导链与货币剪刀差

      - name: "Run commodities sync (大宗商品: WTI/布伦特/铜/铁矿/天然气)"
        working-directory: sync
        run: python run_sync.py commodities

      - name: "Run leading sync (领先指标: NFCI/初请失业金/失业率/工业产出/产能利用率/营建许可/核心资本品订单/消费者信心)"
        working-directory: sync
        run: python run_sync.py leading
        # 说明：Sahm Rule 由前端 API 层现算，无需预计算任务

      # ===== 预计算层：必须在上面取数任务之后，读库计算后写 analysis_results =====
      # 这些任务把原先在 Worker 里跑的重计算（滚动相关/事件研究/OLS 残差）离线化，
      # 用于消除 Cloudflare "Worker exceeded CPU time limit"。顺序不可调整。

      - name: "Run analysis_cross_asset sync (预计算: 跨资产相关性矩阵)"
        working-directory: sync
        run: python run_sync.py analysis_cross_asset

      - name: "Run analysis_macro_consensus sync (预计算: 宏观信号一致性评分)"
        working-directory: sync
        run: python run_sync.py analysis_macro_consensus

      - name: "Run analysis_credit_stress sync (预计算: 信用-利率交叉压力)"
        working-directory: sync
        run: python run_sync.py analysis_credit_stress

      - name: "Run analysis_inflation_anchor sync (预计算: 通胀预期锚定分析)"
        working-directory: sync
        run: python run_sync.py analysis_inflation_anchor

      - name: "Run analysis_yield_curve sync (预计算: 收益率曲线×宏观体制)"
        working-directory: sync
        run: python run_sync.py analysis_yield_curve
        # 说明：依赖上一步 regime_backtest 产出的 regime_snapshots

      - name: "Run analysis_gold_correlation sync (预计算: 黄金定价残差+美元关联)"
        working-directory: sync
        run: python run_sync.py analysis_gold_correlation

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs
          path: sync/logs/*.log
          if-no-files-found: ignore
          retention-days: 14
