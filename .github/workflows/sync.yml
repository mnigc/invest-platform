name: Data Sync (Supabase)

on:
  # 每交易日 23:30（北京时间）→ GitHub Actions 用 UTC，即 15:30；周一至周五
  schedule:
    - cron: "30 15 * * 1-5"
  # 允许手动触发（补跑/调试）
  workflow_dispatch:

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - name: Install dependencies
        working-directory: sync
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Network diagnostics
        if: always()
        continue-on-error: true
        run: |
          echo "== 海外 runner：akshare 国内数据源通常不可直连（预期降级）=="
          echo "== FRED 直连测试 =="
          curl -sS -m 15 -o /dev/null -w "fred http_code=%{http_code}\n" https://api.stlouisfed.org || echo "FRED 直连失败"

      - name: "Run gold_decision sync (国际源: gold-api + Yahoo + FRED)"
        working-directory: sync
        run: python run_sync.py gold_decision
        # 说明：金价历史 + DXY 走 Yahoo，需境外网络，故在 GitHub Actions(海外) 跑。

      - name: "Run sp500 sync (Yahoo Finance)"
        working-directory: sync
        run: python run_sync.py sp500

      - name: "Run regime_backtest sync (预计算回测)"
        working-directory: sync
        run: python run_sync.py regime_backtest
        # 说明：基于指标数据预计算宏观体制回测，解决 backtest API 性能问题

      - name: "Run macro_analysis sync (宏观分析交叉数据)"
        working-directory: sync
        run: python run_sync.py macro_analysis
        # 说明：收益率曲线/通胀预期/信用利差等FRED指标同步

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs
          path: sync/logs/*.log
          if-no-files-found: ignore
          retention-days: 14
