name: Data Sync (Supabase)

on:
  # 每交易日 22:30 UTC（美东 18:30，北京时间次日 06:30）跑，周一至周五。
  # 必须在美国收盘（16:00 ET）与 FRED 当日数据发布（~18:00 ET）之后：
  # 早跑会把盘中未完成 K 线写成「当日收盘价」，且当日宏观值尚未发布。
  schedule:
    - cron: "30 22 * * 1-5"
  # 允许手动触发（补跑/调试）
  workflow_dispatch:

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 全量 16 个任务（含此前遗漏的 regime / nowcast / analysis_liquidity），
    # 且各任务间有 5~25s 的 delay 节流，故比原先的 45 分钟留足余量。
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - name: Install dependencies
        working-directory: sync
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Network diagnostics
        if: always()
        continue-on-error: true
        run: |
          echo "== FRED 直连测试 =="
          curl -sS -m 15 -o /dev/null -w "fred http_code=%{http_code}\n" https://api.stlouisfed.org || echo "FRED 直连失败"

      - name: "Run full daily sync (按 run_sync.py 的 TASK_ORDER 顺序执行全部任务)"
        working-directory: sync
        run: python run_sync.py --group daily
        # 说明：统一走调度入口，任务清单与执行顺序由 run_sync.py 的
        #       TASKS / TASK_ORDER 单一维护。此前 CI 逐个显式调用 run_sync.py <task>，
        #       新增任务时容易忘记同步 workflow，导致 analysis_liquidity / regime /
        #       nowcast 三个任务从未在 CI 执行（全球流动性卡片因此恒失效）。
        #       取数层与预计算层的先后顺序由 TASK_ORDER 保证，不可随意调整。
        #       单个任务失败会被记录并继续执行剩余任务，最终以退出码 1 让 CI 感知。

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs
          path: sync/logs/*.log
          if-no-files-found: ignore
          retention-days: 14
