name: Data Sync (Supabase)

on:
  # 每交易日 23:30（北京时间）→ GitHub Actions 用 UTC，即 15:30；周一至周五
  schedule:
    - cron: "30 15 * * 1-5"
  # 允许手动触发（补跑/调试）
  workflow_dispatch:

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      CN_HTTP_PROXY: ${{ secrets.CN_HTTP_PROXY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - name: Install dependencies
        working-directory: sync
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Network diagnostics
        if: always()
        continue-on-error: true
        run: |
          echo "== CN_HTTP_PROXY == ${CN_HTTP_PROXY:-<未设置>}"
          if [ -n "$CN_HTTP_PROXY" ]; then
            echo "== 通过代理测试国内数据源 (eastmoney) =="
            curl -x "$CN_HTTP_PROXY" -sS -m 15 -o /dev/null -w "proxy eastmoney http_code=%{http_code}\n" https://push2.eastmoney.com || echo "代理访问 eastmoney 失败"
          fi
          echo "== 直连测试 FRED =="
          curl -sS -m 15 -o /dev/null -w "fred http_code=%{http_code}\n" https://api.stlouisfed.org || echo "FRED 直连失败"

      - name: Run data sync (--group daily)
        working-directory: sync
        run: python run_sync.py --group daily

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs
          path: sync/logs/*.log
          if-no-files-found: ignore
          retention-days: 14
