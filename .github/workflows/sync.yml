name: Data Sync (Supabase)

on:
  # 每交易日 23:30 UTC 跑，周一至周五 = 美东冬令时 18:30 / 夏令时 19:30（北京次日 07:30）。
  # 必须在美国收盘（16:00 ET）与 FRED 当日数据发布（~18:00 ET）之后：
  # 早跑会把盘中未完成 K 线写成「当日收盘价」，且当日宏观值尚未发布。
  # 原先的 22:30 UTC 在北半球冬季（EST=UTC-5）只有 17:30 ET，早于 FRED 发布，
  # 23:30 UTC 在最坏情况（冬令时）下仍留 30 分钟余量。
  schedule:
    - cron: "30 23 * * 1-5"
  # 允许手动触发（补跑/调试）
  workflow_dispatch:

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 全量 17 个任务（10 个取数 + 7 个预计算，清单以 `python run_sync.py --list` 为准），
    # 且各任务间有 5~25s 的 delay 节流，故比原先的 45 分钟留足余量。
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - name: Install dependencies
        working-directory: sync
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Network diagnostics
        if: always()
        continue-on-error: true
        run: |
          echo "== FRED 直连测试 =="
          curl -sS -m 15 -o /dev/null -w "fred http_code=%{http_code}\n" https://api.stlouisfed.org || echo "FRED 直连失败"

      - name: "Run full daily sync (按 run_sync.py 的 TASK_ORDER 顺序执行全部任务)"
        working-directory: sync
        run: python run_sync.py --group daily
        # 说明：统一走调度入口，任务清单与执行顺序由 run_sync.py 的
        #       TASKS / TASK_ORDER 单一维护。此前 CI 逐个显式调用 run_sync.py <task>，
        #       新增任务时容易忘记同步 workflow，导致 analysis_liquidity / regime /
        #       nowcast 三个任务从未在 CI 执行（全球流动性卡片因此恒失效）。
        #       取数层与预计算层的先后顺序由 TASK_ORDER 保证，不可随意调整。
        #       单个任务失败会被记录并继续执行剩余任务，最终以退出码 1 让 CI 感知。

      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs
          path: sync/logs/*.log
          if-no-files-found: ignore
          retention-days: 14

  notify-failure:
    # 同步失败时开一个 issue 提醒（定时任务静默失败最难发现）。
    # 403/无权限时该 job 会失败，但不影响 sync 本身。
    needs: sync
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="[sync] 数据同步失败 ($(date -u +%F))"
          body="定时数据同步工作流失败，请检查日志。\n\n运行链接: $RUN_URL"
          # 同一天已有未关闭的同类 issue 时不重复开
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "[sync] 数据同步失败 in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "已有开启的失败 issue #$existing，跳过"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$(printf '%b' "$body")"
          fi
